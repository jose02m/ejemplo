<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Aurora</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="icono_taza">
            <div class="cafe_icono">
                <i class="bi bi-cup-hot"></i>
            </div>
            <div>
                <h1>Café Aurora</h1>
                <p>Panel aministrativo</p>
            </div>
        </div>

        <div class="icono_usuario">
            <i class="bi bi-person-circle"></i>
            <div>
                <strong>Maria Muñoz</strong>
                <p>Administrador</p>
            </div>
            <button class="btn_user">
                <i class="bi bi-chevron-down"></i>
            </button>
        </div>
    </header>

    <main class="dashboard">

        <section class="hero_section">

            <div class="hero_copy">
                <span class="eyebrow">RESUMEN GENERAL</span>
                <h2 id="summary_title">Así está funcionando el negocio</h2>
                <p class="descripcion">
                    Consulta los indicadores clave y detecta cambios en un solo lugar
                </p>
            </div>

            <div class="hero-actions">
                <select name="" id="" class="control-select">
                    <option value="">Este mes</option>
                    <option value="">Este trimestre</option>
                    <option value="">Este año</option>
                </select>

                <button class="export-button">
                    <i class="bi bi-download"></i>
                    <p class="label"> Exportar </p>
                </button>
            </div>
        </section>

        <section class="kpi-grid">
            <article class="kpi-card">
                <div class="kpi-head">
                    <span class="kpi-icon">
                        <i class="bi bi-receipt"></i>
                    </span>

                    <span class="trend positive">
                        <p class="tendencia">
                            ↗︎ +12,5%
                        </p>
                    </span>
                </div>

                <h3>Ventas totales</h3>
                <p class=" ">$ 18.450.000</p>
                <p class="small">Vs periodo anterior</p>
            </article>
            
        </section>

    </main>

</body>

</html>
